<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Wheelie King – Jolt sandbox</title>
  <style>
    html,body{margin:0;height:100%;background:#1a1520;color:#fff;font:600 13px/1.2 system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
    #view{position:absolute;inset:0}
    #view canvas{display:block;width:100%;height:100%}
    #hud{position:absolute;inset:0;pointer-events:none;z-index:2}
    #hud button,.pad{pointer-events:auto}
    .badge{position:fixed;top:4px;right:6px;z-index:3;font:700 11px/1 system-ui,sans-serif;letter-spacing:.12em;color:#111;background:#ffd23d;padding:3px 7px;border-radius:6px;opacity:.9}
    .stat{position:absolute;top:10px;left:10px;text-shadow:0 2px 6px #000}
    .stat .spd{font-size:32px}
    .stat small{font-size:13px;opacity:.85}
    .msg{position:absolute;top:22%;width:100%;text-align:center;font-size:28px;text-shadow:0 0 12px #000}
    .fps{position:absolute;top:10px;right:86px;text-align:right;text-shadow:0 2px 6px #000;font-size:18px}
    .note{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.08em;opacity:.9;text-shadow:0 2px 6px #000}
    .cluster{position:absolute;display:flex;flex-direction:column;gap:8px;align-items:center}
    .left{left:10px;bottom:16px}
    .right{right:10px;bottom:16px;align-items:flex-end}
    .row{display:flex;gap:8px}
    button{
      pointer-events:auto;min-width:64px;min-height:64px;border:2px solid #7ad0ff;border-radius:50%;
      background:#0b2a3ad9;color:#ccefff;font:700 12px/1 system-ui,sans-serif;letter-spacing:.04em;
    }
    button.acc{background:#1a7a32e6;border-color:#5dff88;color:#eaffea;min-width:78px;min-height:78px;font-size:11px}
    button.brk{background:#7a1a1ae6;border-color:#ff6b6b;color:#ffeaea}
    button:active,button.on{filter:brightness(1.35);transform:scale(.96)}
    #status{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;opacity:.75;text-shadow:0 1px 4px #000}
  </style>
</head>
<body>
  <div class="badge">BETA</div>
  <div id="view"></div>
  <div id="hud">
    <div class="note">JOLT SANDBOX · MOTORCYCLE CONTROLLER</div>
    <div class="stat"><div class="spd" data-h="speed">0<small> km/h</small></div><div data-h="mode">GROUND</div><div data-h="info"></div></div>
    <div class="fps" data-h="fps">FPS --</div>
    <div class="msg" data-h="msg"></div>
    <div class="cluster left">
      <div class="row"><button data-k="up">UP</button></div>
      <div class="row"><button data-k="left">LEFT</button><button data-k="right">RIGHT</button></div>
      <div class="row"><button data-k="down">DOWN</button></div>
    </div>
    <div class="cluster right">
      <div class="row"><button data-k="trick">TRICK</button><button data-k="hop">HOP</button></div>
      <div class="row"><button data-k="brake" class="brk">BRAKE</button><button data-k="throttle" class="acc">ACCELERATE</button></div>
    </div>
    <div id="status" data-h="status">Loading Jolt…</div>
  </div>
  <script type="module" src="./jolt-sandbox.js"></script>
</body>
</html>
