<!-- Kit concept renderer. Serve /workspace (parent of the repo) and open /wk-kit-concept/ or copy; paths are absolute from that root. Not shipped. -->
<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head><body>
<script type="importmap">{"imports":{"three":"/wheelie-king-repo/vendor/three.module.js"}}</script>
<script type="module">
import * as T from 'three';
import {RoomEnvironment} from '/wheelie-king-repo/vendor/RoomEnvironment.js';
import {createKit} from '/wheelie-king-repo/src/props/kit/index.js';
import {workshopShell} from '/wheelie-king-repo/src/rooms/workshop-shell.js';
import {workshopProps} from '/wheelie-king-repo/src/rooms/workshop-props.js';
const Q=new URLSearchParams(location.search),PANEL=Q.get('panel')||'front',W=+(Q.get('w')||1280),H=+(Q.get('h')||720);
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(W,H);
renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
document.body.append(renderer.domElement);
const kit=createKit(T);const scene=new T.Scene();
const pm=new T.PMREMGenerator(renderer);const env=new RoomEnvironment(renderer);
for(const [x,c] of [[-3,'#b04cff'],[0,'#52daff'],[3,'#ffb35a']]){const s=new T.Mesh(new T.BoxGeometry(2,.05,.3),new T.MeshBasicMaterial({color:new T.Color(c).multiplyScalar(5)}));s.position.set(x,3.6,0);env.add(s);}
scene.environment=pm.fromScene(env,.04).texture;
const labels=[];const lab=(text,obj,dy=.05)=>{labels.push({text,obj,dy})};
function projectLabels(cam,vp){const out=[];for(const l of labels){const b=new T.Box3().setFromObject(l.obj);const p=new T.Vector3((b.min.x+b.max.x)/2,b.max.y+l.dy,(b.min.z+b.max.z)/2).project(cam);out.push({text:l.text,x:vp[0]+(p.x*.5+.5)*vp[2],y:H-(vp[1]+(p.y*.5+.5)*vp[3])});}return out;}
function studio(){scene.background=new T.Color('#0d0c14');
 const fl=new T.Mesh(new T.PlaneGeometry(40,40),new T.MeshStandardMaterial({color:'#2a2a33',roughness:.35,metalness:.1}));fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;scene.add(fl);
 const back=new T.Mesh(new T.PlaneGeometry(40,12),new T.MeshStandardMaterial({color:'#1b1a26',roughness:.9}));back.position.set(0,6,-3);scene.add(back);
 scene.add(new T.HemisphereLight('#c7b9ff','#201a2a',.35));
 const key=new T.DirectionalLight('#ffe7cf',2.2);key.position.set(3,6,5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-6,right:6,top:5,bottom:-2,near:.5,far:20});key.shadow.bias=-3e-4;key.shadow.normalBias=.02;scene.add(key);
 const rimP=new T.PointLight('#b04cff',30,12,1.6);rimP.position.set(-4,2.6,-1.5);scene.add(rimP);
 const rimC=new T.PointLight('#4fd8ff',24,12,1.6);rimC.position.set(4.5,2.4,-1.2);scene.add(rimC);
 const fill=new T.PointLight('#ffb35a',8,10,1.6);fill.position.set(0,1.5,4);scene.add(fill);}
const info={};
if(PANEL==='parts'){studio();
 const items=[
  ['Caster wheel',kit.build('caster',{radius:.045})],
  ['Drawer + bar handle',kit.build('drawer',{width:.6,height:.1})],
  ['Handles: bar / tube / grip',kit.compose({parts:[{type:'handle',params:{length:.4},at:[0,.14,0]},{type:'handle',params:{style:'tube',length:.3},at:[0,.07,0]},{type:'handle',params:{style:'tube',length:.3,grip:true},at:[0,0,0]}]})],
  ['Chest body (shell)',kit.build('chestBody',{width:.8,height:.7,depth:.5})],
  ['Shelf unit (rack / steel)',kit.compose({parts:[{type:'shelfUnit',params:{width:.7,height:1.3,depth:.4,levels:[.1,.5,.9,1.26]},at:[-.4,0,0]},{type:'shelfUnit',params:{style:'steel',width:.7,height:1.3,depth:.4,levels:[.1,.5,.9,1.26]},at:[.4,0,0]}]})],
  ['Shelf items: bins, carton, cans, case',kit.compose({parts:[{type:'bin',at:[-.36,0,0],params:{label:'M6'}},{type:'bin',at:[-.13,0,0],params:{skin:{body:'#e0b324'},label:'M8'}},{type:'carton',at:[.15,0,0],params:{width:.26,height:.2,depth:.24}},{type:'can',at:[.38,0,0]},{type:'sprayCan',at:[.5,0,0]},{type:'bottle',at:[.6,0,0]},{type:'hardCase',at:[.05,0,.32],params:{}}]})],
  ['Pegboard + hang tools',kit.build('toolWall',{width:1.0,height:.62})],
  ['Bench top + vice',kit.compose({parts:[{type:'benchTop',params:{width:.9,depth:.5}},{type:'vice',at:[.2,.05,-.05]}]})],
  ['Lights + screen',kit.compose({parts:[{type:'shopLight',at:[0,.78,0],params:{length:.7}},{type:'neonTube',at:[0,.66,0],params:{length:.7}},{type:'screen',at:[0,0,0],params:{width:.7,height:.5}}]})]];
 renderer.setScissorTest(true);renderer.autoClear=false;renderer.setClearColor('#0d0c14');renderer.clear();
 const cols=3,rows=3,cw=W/cols,ch=H/rows;info.labels=[];
 for(const [i,[name,o]] of items.entries()){scene.add(o);const b=new T.Box3().setFromObject(o);o.position.set(-(b.min.x+b.max.x)/2,-b.min.y+(name.startsWith('Peg')||name.startsWith('Lights')?.05:0),-(b.min.z+b.max.z)/2);
  const s=new T.Box3().setFromObject(o).getBoundingSphere(new T.Sphere());const cam=new T.PerspectiveCamera(30,cw/ch,.02,60);const dir=new T.Vector3(.55,.42,1).normalize();cam.position.copy(s.center).addScaledVector(dir,s.radius/Math.sin(15*Math.PI/180)*1.05);cam.lookAt(s.center.x,s.center.y-s.radius*.05,s.center.z);
  scene.traverse(m=>{if(m.isMesh)m.castShadow=m.receiveShadow=true});
  const c=i%cols,r=Math.floor(i/cols),x=c*cw,y=H-(r+1)*ch;renderer.setViewport(x,y,cw,ch);renderer.setScissor(x,y,cw,ch);renderer.clear();renderer.render(scene,cam);scene.remove(o);info.labels.push({text:name,x:x+12,y:r*ch+8,cell:true});}
}
else if(PANEL==='chest'){studio();
 const assembled=kit.build('toolChest',{width:.9,height:.9,depth:.55});assembled.position.set(.85,0,0);scene.add(assembled);lab('Assembled: 1 body + 7 drawers + 4 casters',assembled);
 // exploded copy: same parts pulled apart
 const ex=kit.build('toolChest',{width:.9,height:.9,depth:.55,shadow:false});ex.position.set(-.95,0,0);scene.add(ex);
 let di=0;for(const ch of ex.children){const t=ch.userData.kit?.type;if(t==='drawer'){ch.position.z+=.22+di*.03;ch.position.x-=.0;di++;}else if(t==='caster'){ch.position.y-=0;ch.position.x*=1.6;ch.position.z=ch.position.z*1.4+.25;}else if(t==='chestBody'){ch.position.y+=.18;}}
 lab('Exploded: same parts',ex,.24);
 const cam=new T.PerspectiveCamera(30,W/H,.1,60);cam.position.set(.6,1.55,3.6);cam.lookAt(0,.5,0);renderer.render(scene,cam);info.labels=projectLabels(cam,[0,0,W,H]);}
else if(PANEL==='reskin'){studio();
 const blue=kit.build('toolChest',{width:.8,height:.85,depth:.5,skin:{body:'#1f5fd1',handle:'brushed'},casterSkin:{wheel:{preset:'plastic',color:'#e0b324'},fork:'darkSteel'}});blue.position.set(-1.25,0,0);scene.add(blue);
 const top=kit.build('topChest',{width:.8,depth:.42,skin:{body:'#1f5fd1',handle:'brushed'}});top.position.set(-1.25,blue.userData.kit.size[1]+.008,-.04);scene.add(top);lab('Blue chest + top box (reskin)',top);
 const black=kit.build('toolChest',{width:.7,height:.75,depth:.48,drawers:[.1,.1,.1,.2],skin:{body:{preset:'paint',color:'#17181d',clearcoat:1},drawer:'#17181d',handle:{preset:'paint',color:'#d9a51f',metalness:.8}},casterSkin:{hub:{preset:'paint',color:'#d9a51f',metalness:.8}}});black.position.set(0,0,0);scene.add(black);lab('Black + gold, 4 drawers',black);
 const cart=kit.build('trolley',{width:.72,height:.86,depth:.44,skin:{tray:'#c0262f'}});cart.position.set(1.25,0,0);cart.rotation.y=-.3;scene.add(cart);
 for(const [t,a,p] of [['hardCase',[0,.0,-.2],{}],['sprayCan',[.2,0,-.1],{}],['can',[-.2,0,-.15],{}]]){const o=kit.build(t,p);o.position.set(...a);o.position.y=cart.userData.kit.size[1]-.03;cart.add(o);}
 lab('Trolley: same caster part',cart);
 const cam=new T.PerspectiveCamera(30,W/H,.1,60);cam.position.set(0,1.7,4.4);cam.lookAt(0,.55,0);renderer.render(scene,cam);info.labels=projectLabels(cam,[0,0,W,H]);}
else{ // front wall from the real workshop camera
 const TL=new T.TextureLoader(),load=u=>new Promise(r=>TL.load(u,r));const base='/wheelie-king-repo/';
 const [art,mask,relight,brick,concrete,ceiling]=await Promise.all(['icons/neon-garage-background.webp','assets/workshop/art-prop-mask.png','assets/workshop/art-relight.jpg','assets/workshop/brick.jpg','assets/workshop/concrete.jpg','assets/workshop/ceiling.jpg'].map(u=>load(base+u)));
 const shell=workshopShell(T,{art,mask,relight,brick,concrete,ceiling},{quality:Q.get('q')||'desktop'});scene.add(shell.group);scene.background=new T.Color('#000');
 for(const l of shell.pbrLights())scene.add(l);scene.add(new T.HemisphereLight('#8a7cc0','#1a1424',.25));
 const warm=new T.SpotLight('#ffc884',14,6,.9,.6,1.4);warm.position.set(.3,2.75,-3.9);warm.target.position.set(.3,0,-3.4);scene.add(warm,warm.target);
 const warm2=new T.SpotLight('#ffc884',8,5,.9,.6,1.4);warm2.position.set(-.76,2.75,-3.9);warm2.target.position.set(-1.4,0,-3.8);scene.add(warm2,warm2.target);
 scene.environmentIntensity=.6;
 const props=workshopProps(kit);const baked=kit.bake(props);scene.add(baked);info.drawCallsProps=baked.userData.drawCalls;info.instanced=baked.userData.instanced;
 const v=Q.get('view')||'game';const cam=new T.PerspectiveCamera(32,W/H,.05,80);
 const V={game:[[.35,.78,2.05],[-.02,.46,0]],wide:[[.9,1.5,3.6],[-.2,1.0,-2]],orbitR:[[2.8,1.0,0.8],[0,.6,-2]],orbitL:[[-2.2,1.1,1.3],[0,.7,-2]]}[v];
 cam.position.set(...V[0]);cam.lookAt(...V[1]);if(v!=='game'){cam.fov=50;cam.updateProjectionMatrix();}
 shell.renderReflection(renderer,scene,cam);renderer.render(scene,cam);info.calls=renderer.info.render.calls;info.tris=renderer.info.render.triangles;}
window.__info=info;window.__done=true;
</script></body></html>
