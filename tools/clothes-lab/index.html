<!doctype html>
<meta charset="utf-8">
<title>Wheelie King · rider clothes lab</title>
<style>html,body{margin:0;height:100%;background:#2a3038;overflow:hidden}canvas{display:block}#info{position:fixed;left:8px;top:6px;color:#dfe;font:12px system-ui}</style>
<div id="info"></div>
<script type="importmap">{"imports":{"three":"../../vendor/three.module.js"}}</script>
<script type="module">
// Dev tool: the Playground rider (Quaternius UBC) wearing an outfit, in a simple pose, from a fixed view.
// ?top=hr_hoodie_black&pants=hr_joggers_black&shoes=hr_trainers_white&hood=up&pose=t|stand|seated|wheelie&view=front|back|side|three&size=1024
import * as T from '../../vendor/three.module.js';
import { GLTFLoader } from '../../vendor/GLTFLoader.js';
import { RoomEnvironment } from '../../vendor/RoomEnvironment.js';
import { dressUbc } from '../../rider-clothes.js';
const q = new URLSearchParams(location.search), W = +(q.get('w') || innerWidth), H = +(q.get('h') || innerHeight);
const R = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: q.has('alpha') }); R.setSize(W, H); R.outputColorSpace = T.SRGBColorSpace; R.toneMapping = T.ACESFilmicToneMapping; R.shadowMap.enabled = true; document.body.append(R.domElement);
const scene = new T.Scene(); if (!q.has('alpha')) scene.background = new T.Color('#39424d');
scene.environment = new T.PMREMGenerator(R).fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new T.DirectionalLight('#fff', 1.6); sun.position.set(2, 4, 3); scene.add(sun, new T.HemisphereLight('#dfe8ff', '#30302a', 0.5));
const g = await new GLTFLoader().loadAsync('../../assets/quaternius/ubc-superhero-male.glb');
const model = g.scene; scene.add(model); model.updateMatrixWorld(true);
const by = n => model.getObjectByName(n);
const _q1 = new T.Quaternion(), _q2 = new T.Quaternion();
const rot = (n, axis, deg) => { const b = by(n); b.parent.getWorldQuaternion(_q1); b.getWorldQuaternion(_q2); const d = new T.Quaternion().setFromAxisAngle(new T.Vector3(...axis).normalize(), deg * Math.PI / 180); b.quaternion.copy(_q1.invert().multiply(d.multiply(_q2))); model.updateMatrixWorld(true); };
const pose = q.get('pose') || 'stand';
if (pose !== 't') {
  for (const [s, k] of [['l', 1], ['r', -1]]) { rot('upperarm_' + s, [0, 0, 1], -k * (pose === 'stand' ? 72 : 40)); if (pose !== 'stand') { rot('upperarm_' + s, [0, 1, 0], -k * 55); rot('lowerarm_' + s, [0, 1, 0], -k * 25); } }
  if (pose === 'seated' || pose === 'wheelie') {
    rot('spine_01', [1, 0, 0], pose === 'wheelie' ? 8 : 34); rot('neck_01', [1, 0, 0], -20);
    for (const s of ['l', 'r']) { rot('thigh_' + s, [1, 0, 0], -78); rot('calf_' + s, [1, 0, 0], 82); }
  }
}
const clothes = dressUbc(T, model);
const item = id => id ? { id } : null;
await clothes.wear({ top: item(q.get('top')), pants: item(q.get('pants')), shoes: item(q.get('shoes')) }, q.has('hood') ? { hoodUp: q.get('hood') === 'up' } : {});
const wind = +(q.get('wind') || 0); clothes.update(1, wind);
for (let i = 0; i < 40; i++) clothes.update(0.1, wind);
model.traverse(o => { if (o.isMesh) o.castShadow = true; });
const cam = new T.PerspectiveCamera(30, W / H, 0.05, 50);
const view = q.get('view') || 'front', focus = q.get('focus') || 'body';
const tgt = focus === 'top' ? new T.Vector3(0, pose === 't' ? 1.3 : 1.15, 0) : focus === 'feet' ? new T.Vector3(0, 0.12, 0.05) : focus === 'head' ? new T.Vector3(0, 1.6, 0) : new T.Vector3(0, pose === 'seated' || pose === 'wheelie' ? 0.95 : 0.92, 0);
const dist = focus === 'body' ? (pose === 't' ? 5.2 : 4.4) : focus === 'feet' ? 1.3 : focus === 'head' ? 1.4 : 2.6;
const dirs = { front: [0, 0.05, 1], back: [0, 0.05, -1], side: [1, 0.05, 0], three: [0.75, 0.15, 0.8], threeback: [-0.7, 0.2, -0.8], left: [-1, 0.05, 0] };
cam.position.copy(tgt).addScaledVector(new T.Vector3(...dirs[view]).normalize(), dist); cam.lookAt(tgt);
R.render(scene, cam);
document.getElementById('info').textContent = q.has('noinfo') ? '' : JSON.stringify(clothes.state());
window.__LAB__ = { state: clothes.state(), ready: true };
</script>
